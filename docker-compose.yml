services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigap}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./google-service-account.json:/app/google-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["sleep", "infinity"]

volumes:
  db_data:
